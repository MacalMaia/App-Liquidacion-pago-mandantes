# Cloud Build — build, push a Artifact Registry y deploy a Cloud Run
#
# Variables requeridas (se pueden sobreescribir con --substitutions al invocar):
#   _PROJECT_ID   : ID del proyecto GCP (ej: macal-liquidador)
#   _REGION       : Región de Cloud Run (ej: southamerica-west1)
#   _SERVICE_NAME : Nombre del servicio en Cloud Run (ej: liquidador)
#   _REPO_NAME    : Nombre del repositorio en Artifact Registry (ej: liquidador-repo)
#
# Uso manual:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _PROJECT_ID=mi-proyecto,_REGION=southamerica-west1

substitutions:
  _PROJECT_ID: "TU-PROYECTO-GCP"
  _REGION: "southamerica-west1"
  _SERVICE_NAME: "liquidador"
  _REPO_NAME: "liquidador-repo"

steps:
  # 1. Build imagen Docker
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - .

  # 2. Push a Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}"

  # 3. Deploy a Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - --image
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
      - --region
      - "${_REGION}"
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - "1Gi"
      - --cpu
      - "1"
      - --concurrency
      - "4"
      - --max-instances
      - "5"
      # Las variables/secretos de SSO se gestionan directamente en el servicio
      # de Cloud Run (panel "Variables y secretos"). Un deploy sin --set-env-vars
      # ni --set-secrets conserva las variables ya configuradas en el servicio.
      - --set-secrets
      - "ANTHROPIC_API_KEY=anthropic-api-key:latest"

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
